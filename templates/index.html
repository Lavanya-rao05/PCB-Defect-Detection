<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>PCB DEFECT DETECTION</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/favicon.png') }}">
  <!-- Fonts & Icons -->
  <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700&display=swap" rel="stylesheet" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- Custom Styling -->
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to bottom right, #e6f0ff, #ffffff);
      padding-top: 100px;
      overflow-x: hidden;
    }

    .navbar {
      background-color: #0b0f13;
      color: white;
    }

    .nav-link {
      color: white !important;
      font-weight: bold;
      transition: color 0.3s;
    }

    .nav-link:hover {
      color: #cccccc !important;
    }


    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100vw;
      min-height: 100vh;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .form-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 35px 30px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: #fff;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .form-container p {
      text-align: center;
      margin-bottom: 25px;
      color: #ccc;
      font-size: 0.9rem;
    }

    .form-group input {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50px;
      color: #fff;
      padding: 12px 20px;
      margin-bottom: 15px;
    }

    .form-group input::placeholder {
      color: #ccc;
    }

    .btn-success {
      width: 100%;
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 50px;
      padding: 12px;
      font-weight: bold;
    }

    .nav-link {
      cursor: pointer;
    }

    #form1,
    #form2 {
      display: none;
    }

    #form1.active,
    #form2.active {
      display: block;
    }

    .alert {
      text-align: center;
    }
  </style>

</head>

<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">PCB DEFECT DETECTION</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
        <i class="fas fa-bars ms-1"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto text-uppercase">
          <li class="nav-item"><a class="nav-link" onclick="toggleForm(event)" data-value="#form1">Signin</a></li>
          <li class="nav-item"><a class="nav-link" onclick="toggleForm(event)" data-value="#form2">Signup</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Message -->
  {% if msg %}
  <div class="container mt-5">
    <div class="alert alert-info alert-dismissible fade show" role="alert">
      <strong>{{ msg }}</strong>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">&times;</button>
    </div>
  </div>
  {% endif %}

  <!-- Login Form -->
  <div class="form-container" id="form1" class="active">
    <form method="post" action="{{ url_for('userlog') }}">
      <h2>Login</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" name="name" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" name="password" required />
      </div>
      <button type="submit" class="btn btn-success">Login</button>
    </form>
  </div>

  <!-- Register Form -->
  <div class="form-container" id="form2">
    <form method="post" action="{{ url_for('userreg') }}">
      <h2>Register</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" name="name"  required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" name="email" required />
      </div>
      <div class="form-group">
        <label for="phone">Mobile No.</label>
        <input type="tel" class="form-control" name="phone" pattern="[0-9]{10}" title="10 digit number"
         required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" name="password" required />
      </div>
      <button type="submit" class="btn btn-success">Register</button>
    </form>
  </div>

  <video autoplay muted loop playsinline id="bg-video">
    <source src="{{ url_for('static', filename='assets/Animation1.mp4') }}" type="video/mp4">
  </video>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleForm(e) {
      var targetId = e.target.getAttribute('data-value');
      ['#form1', '#form2'].forEach(function (id) {
        if (id === targetId) {
          $(id).addClass('active');
        } else {
          $(id).removeClass('active');
        }
      });
    }

    // Show login form by default
    $(document).ready(function () {
      $('#form1').addClass('active');
    });
  </script>
</body>

</html>
